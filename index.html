<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dcecc9">
  <meta name="color-scheme" content="light">
  <meta name="description" content="머릿속에 숨어버린 단어 찾기">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hide & Seek">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icons/icon-180x180.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./hide-runtime.css">
  <link rel="stylesheet" href="./hide-bridge.css">
  <title>Hide & Seek</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="top-safe">
      <button id="backBtn" class="icon-btn ghost" type="button" aria-label="뒤로 가기" hidden>‹</button>
      <div class="brand-lockup" aria-label="Hide & Seek">
        <span class="brand-mark">H&S</span>
        <span class="brand-copy"><b>HIDE & SEEK</b><small>Hidden Word Trail</small></span>
      </div>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="설정">설정</button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <aside id="partnerBar" class="partner-bar" aria-live="polite">
      <img id="partnerAvatar" src="./assets/characters/guide_default.png" alt="길잡이">
      <div class="partner-copy">
        <b id="partnerName">길잡이</b>
        <span id="partnerText">숨은 단어부터 천천히 찾아볼까?</span>
      </div>
      <button id="partnerVoiceBtn" class="voice-btn" type="button" aria-label="길잡이 음성 듣기">듣기</button>
    </aside>

    <nav id="bottomNav" class="bottom-nav" aria-label="주요 메뉴">
      <button data-tab="home" class="nav-btn active" type="button"><img src="./assets/ui/home.png" alt=""><span>홈</span></button>
      <button data-tab="sheets" class="nav-btn" type="button"><img src="./assets/ui/study.png" alt=""><span>시험지</span></button>
      <button data-tab="study" class="nav-btn" type="button"><img src="./assets/ui/quiz.png" alt=""><span>학습</span></button>
      <button data-tab="words" class="nav-btn" type="button"><img src="./assets/ui/review.png" alt=""><span>단어장</span></button>
      <button data-tab="records" class="nav-btn" type="button"><img src="./assets/ui/mypage.png" alt=""><span>기록</span></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <input id="profileCameraInput" type="file" accept="image/*" capture="user" hidden>
  <input id="profileLibraryInput" type="file" accept="image/*" hidden>
  <input id="sheetCameraInput" type="file" accept="image/*" capture="environment" hidden>
  <input id="sheetLibraryInput" type="file" accept="image/*" multiple hidden>
  <input id="importDataInput" type="file" accept="application/json,.json" hidden>
  <script src="./vendor/taky/release-contract.js"></script>
  <script src="./vendor/taky/pwa-update-state.js"></script>
  <script src="./vendor/taky/event-envelope.js"></script>
  <script src="./vendor/taky/vision-ingest.js"></script>
  <script src="./vendor/taky/http-json.js"></script>
  <script src="./hide-release-v01.js"></script>
  <script src="./vendor/taky/explorer-crew/contracts-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/runtime-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/relation-affinity-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/shared-memory-episode-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/state-store-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/personality-source-board-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/personality-registry-v2.js"></script>
  <script src="./vendor/taky/explorer-crew/behavior-patterns-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/personality-behavior-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/dialogue-personality-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/role-behavior-policy-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/semantic-command-compat-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/runtime-policy-pr10-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/runtime-policy-adapter-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/composable-asset-manifest-pr10-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/manifest-registry-pr10-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/asset-engine-pr10-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/ui-renderer-pr10-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/composable-promotion-gate-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/asset-render-adapter-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/runtime-log-pr10-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/runtime-log-adapter-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/canonical-runtime-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/handoff-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/companion-gate-registry-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/companion-gate-policy-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/story-gate-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/browser-host-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/render-plan-dom-consumer-v1.js"></script>
  <script src="./vendor/taky/explorer-crew/system-v2.js"></script>
  <script src="./vendor/taky/explorer-crew/app-consumer-v2.js"></script>
  <script src="./hide-explorer-crew-authority-consumer-v2.js"></script>
  <script src="./app.js"></script>
  <script src="./hide-runtime.js"></script>
  <script src="./hide-bridge.js"></script>
  <script src="./hide-pwa-update-v01.js"></script>
  <script src="./hide-brand-current.js"></script>
</body>
</html>
