name: Hide Mobile WebKit Visual and OCR Gate

on:
  pull_request:
    paths:
      - 'src/v2/**'
      - 'v2.html'
      - 'assets/visual/**'
      - 'tests/hide-approved-mossfall.spec.js'
      - 'tests/hide-ocr-intake-import.spec.js'
      - 'playwright.visual-webkit.config.cjs'
      - '.github/workflows/hide-mossfall-webkit.yml'

permissions:
  contents: read

jobs:
  webkit-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser harness
        run: npm install --no-audit --no-fund
      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit
      - name: Check source visual authority (missing binary remains HOLD)
        run: node tools/verify-approved-mossfall.js
      - name: Exercise mobile WebKit world, focus and OCR source review
        run: npx playwright test tests/hide-approved-mossfall.spec.js tests/hide-ocr-intake-import.spec.js --config=playwright.visual-webkit.config.cjs --reporter=line
