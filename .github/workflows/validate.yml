name: Validate Hide & Seek

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard product identity
        run: python tools/validate-hide-seek-name-purge.py
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check hide-brand-current.js
          node --check hide-bridge.js
          node --check hide-runtime.js
          node --check hide-release-v01.js
          node --check hide-pwa-update-v01.js
          node --check vendor/taky/release-contract.js
          node --check vendor/taky/pwa-update-state.js
          node --check hide-explorer-crew-authority-consumer-v2.js
          for f in vendor/taky/explorer-crew/*.js; do node --check "$f"; done
      - name: Validate shared runtime contract
        run: node tests/shared-runtime-contract.test.js
      - name: Validate Explorer Crew Runtime V2 main consumer
        run: |
          node tests/explorer-crew-v2-source-lock.test.js
          node tests/explorer-crew-v2-authority.test.js
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hide-http.log 2>&1 &
          echo $! > /tmp/hide-http.pid
      - name: Run shared runtime browser regression
        run: npx playwright test tests/shared-runtime.spec.js tests/explorer-crew-v2-authority.spec.js --reporter=line
