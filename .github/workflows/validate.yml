name: Validate Hide & Seek

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate app Scene Policy adapter
        run: node tests/scene-policy-adapter.spec.js
      - name: Validate character Runtime adapter
        run: node tests/character-runtime-adapter.spec.js
      - name: Validate character Scene event bridge
        run: node tests/character-scene-bridge.spec.js
      - name: Validate character Binding registry
        run: node tests/character-binding-registry.spec.js
      - name: Validate character Binding selector integrity
        run: node tests/character-binding-selector-integrity.spec.js
      - name: Validate character UI Binding planner
        run: node tests/character-ui-binding-planner.spec.js
      - name: Validate character UI Binding event bridge
        run: node tests/character-ui-binding-bridge.spec.js
      - name: Validate fail-closed character DOM binder
        run: node tests/character-dom-binder.spec.js
      - name: Validate approved asset resolver
        run: node tests/approved-asset-resolver.spec.js
      - name: Validate TAKY Design Gate authority
        run: node tools/validate-design-gate.mjs
      - name: Guard product identity
        run: python tools/validate-hide-seek-name-purge.py
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check hide-brand-current.js
          node --check hide-bridge.js
          node --check hide-runtime.js
          node --check hide-release-v01.js
          node --check hide-pwa-update-v01.js
          node --check vendor/taky/release-contract.js
          node --check vendor/taky/pwa-update-state.js
      - name: Validate shared runtime contract
        run: node tests/shared-runtime-contract.test.js
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hide-http.log 2>&1 &
          echo $! > /tmp/hide-http.pid
      - name: Run shared runtime browser regression
        run: npx playwright test tests/shared-runtime.spec.js --reporter=line
      - name: Run TAKY visual audit capture
        run: npx playwright test tests/ui-visual-audit.spec.js --reporter=line
      - name: Install visual comparison dependency
        run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Compare runtime renders to approved Golden references
        run: python3 tools/compare-golden.py
      - name: Issue Design Gate receipt
        run: python3 tools/issue-design-gate-receipt.py --app HIDE_SEEK --interaction-pass --responsive-pass --asset-integrity-pass
      - name: Upload TAKY visual audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taky-design-gate-ui-audit
          path: ui-audit/*
          if-no-files-found: warn
          retention-days: 7
